<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTG Life Tracker — TV</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg: #131419;
    --text: #fff;
    --muted: #9aa0ad;
    --gold: #ffd76a;
    --danger: #ff5a4e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    cursor: none;
  }
  #stage { position: relative; width: 100vw; height: 100vh; }

  #grid {
    position: absolute; inset: 0;
    display: grid; gap: 2.6vh; padding: 2.6vh;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
  }
  #grid.p1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  #grid.p2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
  #grid.p5, #grid.p6 { grid-template-columns: 1fr 1fr 1fr; }
  .player {
    position: relative; overflow: hidden;
    border-radius: 22px; border: 3px solid #060709;
    background: #12151d;
  }
  .player.active { border-color: var(--gold); box-shadow: 0 0 30px rgba(255,215,106,.25); }
  .player .art {
    position: absolute; inset: 0; background-size: cover; background-position: center 20%;
  }
  .player.dead .art { filter: grayscale(1) brightness(.45); }

  .player .name {
    position: absolute; top: 2vh; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.8); border-radius: 12px; padding: .9vh 1.8vw;
    font-size: 2.8vh; font-weight: 600; white-space: nowrap;
    max-width: 80%; overflow: hidden; text-overflow: ellipsis;
  }
  .player .name .crown { color: var(--gold); }

  .player .life {
    position: absolute; top: 52%; transform: translateY(-50%);
    font-size: 19vh; font-weight: 300; line-height: 1; color: #fff;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 26px rgba(0,0,0,.9), 0 4px 18px rgba(0,0,0,.9);
  }
  .player .life { right: 5%; }
  .player.flip .life { right: auto; left: 5%; }
  .player .life.bump { animation: bump .4s ease; }
  @keyframes bump { 40% { transform: translateY(-50%) scale(1.15); } }

  .player .subbox {
    position: absolute; top: 55%; transform: translateY(-50%);
    background: rgba(0,0,0,.78); border-radius: 16px; padding: 1.1vh;
    display: grid; grid-template-columns: 1fr 1fr; gap: 1vh;
  }
  .player .subbox { left: 4%; }
  .player.flip .subbox { left: auto; right: 4%; }
  .tile {
    position: relative; width: 10.5vw; height: 8.5vh; border-radius: 12px; overflow: hidden;
    background-size: cover; background-position: center 25%; background-color: #1f2430;
    border: 1px solid rgba(255,255,255,.15);
  }
  .tile::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,.3); }
  .tile .d {
    position: absolute; inset: 0; z-index: 1;
    display: flex; align-items: center; justify-content: center;
    font-size: 4.6vh; font-weight: 400; color: #fff;
    text-shadow: 0 2px 10px #000, 0 0 14px rgba(0,0,0,.8);
  }
  .tile.lethal .d { color: var(--danger); }

  .player .cname {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 1vh;
    font-size: 1.9vh; color: #d9dbe0; background: rgba(0,0,0,.72);
    border-radius: 10px; padding: .4vh 1.2vw; max-width: 85%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .player .offline {
    position: absolute; top: 2vh; right: 1.5vw; font-size: 1.8vh; color: var(--danger);
    background: rgba(0,0,0,.8); padding: .5vh 1vw; border-radius: 10px;
  }

  #turnPill {
    position: absolute; bottom: .4vh; left: 50%; transform: translateX(-50%);
    z-index: 6; background: rgba(0,0,0,.85); border-radius: 14px 14px 0 0;
    padding: .7vh 2vw; font-size: 2vh; color: var(--muted);
    display: flex; gap: 1.2vw; align-items: center; white-space: nowrap;
  }
  #turnPill b { color: #fff; font-weight: 700; }
  #turnPill .crown { color: var(--gold); }

  /* big obnoxious center countdown */
  #bigTimer {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    z-index: 8; display: none; text-align: center;
    background: rgba(0,0,0,.86); border: 4px solid rgba(255,255,255,.25);
    border-radius: 30px; padding: 1.5vh 5vw;
    font-size: 18vh; font-weight: 300; line-height: 1.15; color: #fff;
    font-variant-numeric: tabular-nums;
    box-shadow: 0 0 60px rgba(0,0,0,.8);
  }
  #bigTimer .lbl { display: block; font-size: 2.4vh; color: var(--muted); letter-spacing: 3px; text-transform: uppercase; }
  #bigTimer.low { color: var(--danger); border-color: var(--danger); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .3; } }

  /* big anonymous vote prompt */
  #bigVote {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    z-index: 8; display: none; text-align: center;
    background: rgba(0,0,0,.88); border: 4px solid var(--gold);
    border-radius: 30px; padding: 3vh 5vw;
    box-shadow: 0 0 60px rgba(255,215,106,.25);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse { 50% { box-shadow: 0 0 100px rgba(255,215,106,.45); } }
  #bigVote .lbl { font-size: 3vh; color: var(--gold); letter-spacing: 3px; text-transform: uppercase; }
  #bigVote .time { font-size: 13vh; font-weight: 300; line-height: 1.15; color: #fff; font-variant-numeric: tabular-nums; }
  #bigVote .cnt { font-size: 3.4vh; color: #fff; font-weight: 700; }
  #bigVote .hint { font-size: 2vh; color: var(--muted); margin-top: .6vh; }

  /* sound status pill */
  #soundHint {
    position: absolute; bottom: 2vh; right: 1.5vw; z-index: 9;
    background: rgba(0,0,0,.85); border-radius: 12px; padding: 1vh 1.5vw;
    font-size: 2vh; color: var(--gold); display: none;
  }

  #joinBox {
    position: absolute; inset: 0; z-index: 10; background: var(--bg);
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 3vh;
  }
  #joinBox h1 { font-size: 5vh; color: var(--gold); letter-spacing: 3px; font-weight: 300; }
  #joinBox .url { font-size: 3.4vh; font-weight: 700; background: #1f2430; padding: 1.5vh 2.5vw; border-radius: 14px; }
  #qr { background: #fff; padding: 14px; border-radius: 12px; }
  #joinBox p { color: var(--muted); font-size: 2.2vh; }

  #connDot { position: absolute; top: 1.5vh; left: 1vw; width: 1.4vh; height: 1.4vh; border-radius: 50%; background: var(--danger); z-index: 20; opacity: .9; }
  #connDot.on { opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="connDot"></div>
  <div id="grid"></div>
  <div id="turnPill"></div>
  <div id="bigTimer"></div>
  <div id="bigVote"></div>
  <div id="soundHint"></div>
  <div id="joinBox">
    <h1>⚔️ COMMANDER</h1>
    <div class="url" id="joinUrl"></div>
    <div id="qr"></div>
    <p>Scan or type the address on your phone to join</p>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let ws, reconnectDelay = 500;
  let game = { players: {}, turnOrder: [], activeIdx: 0, turnNumber: 1, timer: { votes: [], pendingSeconds: 0, running: false, endsAt: 0, duration: 300 } };
  let prevLife = {};
  let clockOffset = 0;
  let lastExpiredAt = 0;

  const joinUrl = location.origin.replace(/^https?:\/\//, '');
  $('joinUrl').textContent = joinUrl;
  new QRCode($('qr'), { text: location.origin, width: 180, height: 180 });

  // ---------- sound effects ----------
  let soundUnlocked = false;
  let soundOn = localStorage.getItem('tvSound') !== '0';
  let soundLib = {};
  fetch('/sounds-list').then((r) => r.json()).then((d) => { soundLib = d || {}; updateSoundHint(); }).catch(() => {});

  function hasSounds() { return Object.keys(soundLib).some((k) => soundLib[k] && soundLib[k].length); }
  function play(cat) {
    if (!soundUnlocked || !soundOn) return;
    const list = soundLib[cat];
    if (!list || !list.length) return;
    try {
      const a = new Audio(list[Math.floor(Math.random() * list.length)]);
      a.play().catch(() => {});
    } catch {}
  }
  let hintTimer;
  function updateSoundHint(temporary) {
    const h = $('soundHint');
    clearTimeout(hintTimer);
    if (!hasSounds()) { h.style.display = 'none'; return; }
    if (!soundUnlocked) {
      h.textContent = '🔊 Press OK on the remote for sound';
      h.style.display = 'block';
      return;
    }
    h.textContent = soundOn ? '🔊 Sound on' : '🔇 Sound off (OK toggles)';
    h.style.display = 'block';
    hintTimer = setTimeout(() => { h.style.display = 'none'; }, 3000);
  }
  function onOk() {
    if (!soundUnlocked) {
      soundUnlocked = true;
      soundOn = true;
      localStorage.setItem('tvSound', '1');
      // warm up the audio pipeline inside the user gesture
      try { const a = new Audio(); a.muted = true; a.play().catch(() => {}); } catch {}
      play('turn');
    } else {
      soundOn = !soundOn;
      localStorage.setItem('tvSound', soundOn ? '1' : '0');
    }
    updateSoundHint(true);
  }
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.keyCode === 13 || e.keyCode === 23) onOk();
  });
  document.addEventListener('click', onOk);

  // sound event detection
  let prevTurnKey = null, prevTimerRunning = false, prevLifeSnd = {}, dmgPending = null, lastDmgSound = 0;
  function detectSoundEvents() {
    const key = `${game.turnNumber}:${game.activeIdx}`;
    if (prevTurnKey !== null && key !== prevTurnKey && game.turnOrder.length > 0) play('turn');
    prevTurnKey = key;

    const running = !!(game.timer && game.timer.running);
    if (running && !prevTimerRunning) play('timer');
    prevTimerRunning = running;

    let anyLoss = false;
    for (const id of game.turnOrder) {
      const p = game.players[id];
      if (!p) continue;
      const prev = prevLifeSnd[id];
      if (prev !== undefined && p.life < prev) anyLoss = true;
      prevLifeSnd[id] = p.life;
    }
    if (anyLoss) {
      clearTimeout(dmgPending);
      dmgPending = setTimeout(() => {
        const now = Date.now();
        if (now - lastDmgSound > 800) { lastDmgSound = now; play('damage'); }
      }, 600);
    }
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}`);
    ws.onopen = () => {
      reconnectDelay = 500;
      $('connDot').classList.add('on');
      ws.send(JSON.stringify({ type: 'hello' }));
    };
    ws.onclose = () => {
      $('connDot').classList.remove('on');
      setTimeout(connect, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 2, 5000);
    };
    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'welcome') {
        game = msg.state;
        if (game.now) clockOffset = game.now - Date.now();
        prevTurnKey = `${game.turnNumber}:${game.activeIdx}`;
        prevTimerRunning = !!(game.timer && game.timer.running);
        for (const id of game.turnOrder) if (game.players[id]) prevLifeSnd[id] = game.players[id].life;
        render();
      } else if (msg.type === 'state') {
        game = msg.state;
        if (game.now) clockOffset = game.now - Date.now();
        detectSoundEvents();
        render();
      }
    };
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function isFlipped(i, n) {
    const cols = n <= 2 ? n : (n <= 4 ? 2 : 3);
    return (i % cols) === cols - 1 && cols > 1;
  }

  function fmt(s) {
    const m = Math.floor(Math.max(s, 0) / 60), r = Math.max(s, 0) % 60;
    return `${m}:${String(r).padStart(2, '0')}`;
  }

  function renderCenter() {
    const t = game.timer || {};
    const bigT = $('bigTimer');
    const bigV = $('bigVote');
    const n = game.turnOrder.length;

    // anonymous vote prompt
    if (!t.running && t.votes && t.votes.length > 0 && n > 0) {
      const majority = Math.floor(n / 2) + 1;
      bigV.style.display = 'block';
      bigV.innerHTML = `
        <div class="lbl">Timer for this turn?</div>
        <div class="time">⏱ ${fmt(t.pendingSeconds)}</div>
        <div class="cnt">${t.votes.length} / ${majority} votes to start</div>
        <div class="hint">vote on your phone — ⏱ button</div>`;
    } else {
      bigV.style.display = 'none';
    }

    // running countdown
    if (t.running && n > 0) {
      const rem = Math.round((t.endsAt - (Date.now() + clockOffset)) / 1000);
      const act = game.players[game.turnOrder[game.activeIdx]];
      bigT.style.display = 'block';
      bigT.innerHTML = `<span class="lbl">${esc(act ? act.name : '')}'s turn</span>${rem <= 0 ? 'TIME!' : fmt(rem)}`;
      bigT.classList.toggle('low', rem <= 30);
      if (rem <= 0 && t.endsAt !== lastExpiredAt) {
        lastExpiredAt = t.endsAt;
        play('timerend');
      }
    } else {
      bigT.style.display = 'none';
    }
  }

  setInterval(renderCenter, 500);

  function renderPill() {
    const ids = game.turnOrder;
    const n = ids.length;
    if (n === 0) return;
    const act = game.players[ids[game.activeIdx]];
    const next = game.players[ids[(game.activeIdx + 1) % n]];
    $('turnPill').innerHTML =
      `<span>Turn ${game.turnNumber}</span>` +
      `<span><span class="crown">👑</span> <b>${esc(act ? act.name : '')}</b></span>` +
      `<span>next: ${esc(next ? next.name : '')}</span>`;
  }

  function render() {
    const ids = game.turnOrder;
    const n = ids.length;
    $('joinBox').style.display = n === 0 ? 'flex' : 'none';
    $('turnPill').style.display = n === 0 ? 'none' : 'flex';

    const grid = $('grid');
    grid.className = `p${Math.min(Math.max(n, 1), 6)}`;
    grid.innerHTML = '';

    ids.forEach((id, i) => {
      const p = game.players[id];
      if (!p) return;
      const isActive = i === game.activeIdx;
      const dead = p.life <= 0 || Object.values(p.cmdDamage || {}).some((d) => d >= 21);
      const opponents = ids.filter((oid) => oid !== id);

      const div = document.createElement('div');
      div.className = `player${isActive ? ' active' : ''}${dead ? ' dead' : ''}${isFlipped(i, n) ? ' flip' : ''}`;
      div.innerHTML = `
        <div class="art" style="background-image:url('${p.commander && p.commander.art ? p.commander.art : ''}')"></div>
        ${p.connected ? '' : '<div class="offline">⚠ offline</div>'}
        <div class="name">${isActive ? '<span class="crown">👑</span> ' : ''}${esc(p.name)}</div>
        <div class="life" id="life-${id}">${p.life}</div>
        <div class="subbox">${opponents.map((oid) => {
          const o = game.players[oid];
          const d = (p.cmdDamage && p.cmdDamage[oid]) || 0;
          return `<div class="tile${d >= 21 ? ' lethal' : ''}" style="background-image:url('${o && o.commander && o.commander.art ? o.commander.art : ''}')">
            <div class="d">${d}</div>
          </div>`;
        }).join('')}</div>
        <div class="cname">${esc(p.commander ? p.commander.name : '')}</div>`;
      grid.appendChild(div);

      if (prevLife[id] !== undefined && prevLife[id] !== p.life) {
        const el = document.getElementById(`life-${id}`);
        requestAnimationFrame(() => el.classList.add('bump'));
      }
      prevLife[id] = p.life;
    });

    renderPill();
    renderCenter();
  }

  // ---------- keep the Firestick awake ----------
  let wakeLock = null;
  async function keepAwake() {
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => setTimeout(keepAwake, 1000));
    } catch {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') keepAwake();
  });
  keepAwake();

  // Fallback: an invisible always-playing video also blocks the screensaver
  try {
    const cv = document.createElement('canvas');
    cv.width = cv.height = 2;
    const ctx = cv.getContext('2d');
    let tick = 0;
    setInterval(() => { ctx.fillStyle = tick++ % 2 ? '#000' : '#010101'; ctx.fillRect(0, 0, 2, 2); }, 1000);
    const v = document.createElement('video');
    v.srcObject = cv.captureStream(1);
    v.muted = true;
    v.setAttribute('playsinline', '');
    v.style.cssText = 'position:absolute;width:2px;height:2px;opacity:0.01;pointer-events:none;';
    document.body.appendChild(v);
    const tryPlay = () => v.play().catch(() => setTimeout(tryPlay, 3000));
    tryPlay();
  } catch {}

  connect();
})();
</script>
</body>
</html>
