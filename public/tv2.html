@font-face { font-family: 'Peteroy'; src: url(/tablet-assets/Peteroy.woff2) format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: #08080A; font-family: 'Cinzel', Georgia, serif; cursor: none; }
#stage { position: absolute; width: 1586px; height: 992px; transform-origin: top left; }
#strip { position: absolute; top: 0; left: 0; width: 1586px; height: 992px; overflow: hidden; }
.screenpage { position: absolute; top: 0; left: 0; width: 1586px; height: 992px; box-sizing: border-box; background: #08080A; color: #EFEAE0; overflow: hidden; will-change: transform; }
.activeGlow { position: absolute; top: 0; right: 0; bottom: 0; left: 0; opacity: 0; transition: opacity 0.4s ease; box-shadow: inset 0 0 0 4px #C9A227, inset 0 0 90px rgba(201,162,39,0.38); pointer-events: none; }
.seat.active .activeGlow { opacity: 1; animation: glowPulse 2.6s ease-in-out infinite; }
@keyframes glowPulse { 50% { box-shadow: inset 0 0 0 4px #E8C96A, inset 0 0 120px rgba(232,201,106,0.5); } }
.seat.dead .seatArt { filter: grayscale(1) brightness(0.4) !important; }
.deadTag { display: none; position: absolute; left: 0; right: 0; top: calc(50% + 96px); text-align: center; font-size: 16px; font-weight: 700; letter-spacing: 0.34em; color: #DC5A42; text-shadow: 0 2px 10px rgba(8,8,10,0.9); }
.seat.dead .deadTag { display: block; }
.lifeVal.bump { animation: bump 0.4s ease; }
@keyframes bump { 40% { transform: scaleY(1.22) scale(1.12); } }
#timerPlate { width: 220px; height: 63px; box-sizing: border-box; border-radius: 7px; border: 2px solid #1a1305;
  background: linear-gradient(180deg, #f2d783 0%, #d8b04a 46%, #a87f22 100%);
  box-shadow: inset 0 1.5px 0 rgba(255,244,205,0.9), inset 0 -3px 6px rgba(90,60,10,0.55), 0 0 0 1px rgba(201,162,39,0.6), 0 5px 14px rgba(0,0,0,0.8);
  display: flex; align-items: center; justify-content: center; color: #241b06; }
#timerPlate .t { font-family: 'Peteroy', Georgia, serif; font-size: 44px; line-height: 1; display: inline-block; transform: scaleY(1.22); letter-spacing: 0.03em; }
#timerPlate .s { font-size: 21px; font-weight: 900; letter-spacing: 0.12em; }
#timerPlate.low { background: linear-gradient(180deg, #f39a86 0%, #d8563f 46%, #8e2616 100%); color: #2a0703; animation: lowPulse 1s ease-in-out infinite; }
@keyframes lowPulse { 50% { box-shadow: inset 0 1.5px 0 rgba(255,220,210,0.9), 0 0 26px rgba(220,90,66,0.8); } }
#cmdrRow { position: absolute; top: 188px; right: 0; left: 0; display: flex; justify-content: center; align-items: flex-start; gap: 40px; }

.cmdrCard img { width: 290px; height: 404px; object-fit: cover; display: block; }
.cmdrCol.active .cmdrCard { border: 2px solid #C9A227; box-shadow: 0 0 26px rgba(201,162,39,0.35); }
.cmdrCol .cn { width: 290px; text-align: center; font-size: 16px; font-weight: 700; letter-spacing: 0.08em; color: #F3EEE3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

#joinOv .u { font-size: 24px; letter-spacing: 0.1em; color: #A79C86; border: 1px solid #6A552A; border-radius: 10px; padding: 12px 26px; }
#qr { background: #fff; padding: 12px; border-radius: 10px; }
#connDot { position: fixed; top: 10px; left: 10px; width: 9px; height: 9px; border-radius: 50%; background: #DC5A42; z-index: 90; opacity: 0.9; }
#connDot.on { opacity: 0; }
#motes { position: absolute; top: 0; left: 0; width: 1586px; height: 992px; z-index: 7; pointer-events: none; }
